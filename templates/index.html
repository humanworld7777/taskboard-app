<script>
    // Explicitly configure Socket.IO with polling fallback for cloud proxies like Render
    const socket = io({
      transports: ['polling', 'websocket'],
      secure: true
    });

    let targetStatus = 'todo';

    // Socket Connection Handlers & Debugging
    socket.on('connect', () => {
      console.log('Socket connected successfully! ID:', socket.id);
      const statusBadge = document.getElementById('status');
      statusBadge.textContent = 'Live Connected';
      statusBadge.classList.add('connected');
      fetchInitialTasks();
    });

    socket.on('connect_error', (err) => {
      console.error('Socket connection error:', err);
      const statusBadge = document.getElementById('status');
      statusBadge.textContent = 'Connection Error';
    });

    socket.on('disconnect', (reason) => {
      console.warn('Socket disconnected:', reason);
      const statusBadge = document.getElementById('status');
      statusBadge.textContent = 'Disconnected';
      statusBadge.classList.remove('connected');
    });

    // Receive task updates in real-time from server
    socket.on('task_updated', (data) => {
      const card = document.getElementById(`task-${data.id}`);
      if (card) {
        const targetList = document.getElementById(`${data.status}-list`);
        if (targetList) targetList.appendChild(card);
      }
    });

    // Receive new tasks in real-time
    socket.on('task_created', (task) => {
      renderTaskCard(task);
    });

    // Fetch initial task state on load
    async function fetchInitialTasks() {
      try {
        const response = await fetch('/api/tasks');
        const tasks = await response.json();
        document.querySelectorAll('.task-list').forEach(el => el.innerHTML = '');
        tasks.forEach(task => renderTaskCard(task));
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    function renderTaskCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.id = `task-${task.id}`;
      card.draggable = true;
      card.textContent = task.title;
      card.ondragstart = (e) => e.dataTransfer.setData('text/plain', task.id);

      const targetList = document.getElementById(`${task.status}-list`);
      if (targetList) targetList.appendChild(card);
    }

    // Drag and Drop Logic
    function allowDrop(ev) {
      ev.preventDefault();
    }

    function drop(ev) {
      ev.preventDefault();
      const taskId = ev.dataTransfer.getData('text/plain');
      let targetElement = ev.target;
      
      while (targetElement && !targetElement.classList.contains('column')) {
        targetElement = targetElement.parentElement;
      }

      if (targetElement) {
        const newStatus = targetElement.getAttribute('data-status');
        socket.emit('update_task', { id: parseInt(taskId), status: newStatus });
      }
    }

    // Modal Helpers
    function openModal(status) {
      targetStatus = status;
      document.getElementById('taskModal').style.display = 'flex';
      document.getElementById('taskTitleInput').focus();
    }

    function closeModal() {
      document.getElementById('taskModal').style.display = 'none';
      document.getElementById('taskTitleInput').value = '';
    }

    async function submitTask() {
      const title = document.getElementById('taskTitleInput').value.trim();
      if (!title) return;

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, status: targetStatus })
      });

      closeModal();
    }
  </script>
